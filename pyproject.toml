[project]
name = "audiobook-crafter"
version = "0.1.0"
description = "Turn PDFs, EPUBs and scripts into full-cast, studio-style audiobooks with local TTS and an LLM director."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "httpx>=0.27",
    "numpy>=1.24",
    "soundfile>=0.12",
    "pymupdf>=1.24",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "num2words>=0.5.13",
]

[project.optional-dependencies]
# Default engine: Qwen3-TTS (voice design + voice cloning + preset voices).
qwen = [
    "qwen-tts>=0.1.1",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
]
# Alternative engine: Resemble AI Chatterbox (Multilingual / English / Turbo).
chatterbox = [
    "chatterbox-tts>=0.1.7",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
]
# Alternative engine: VoxCPM2 (style prompts on cloned voices, 30 languages incl. Hindi).
voxcpm = [
    "voxcpm>=2.0.3; python_version < '3.13'",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
]
# Bring-your-own-key Anthropic models as the LLM brain (other providers need no extra packages).
anthropic = ["anthropic>=1.13"]
# ASR-based quality check of every generated clip.
qa = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
abcraft = "audiobook_crafter.cli:main"
audiobook-crafter = "audiobook_crafter.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook_crafter"]

[tool.uv]
# qwen-tts pins transformers==4.57.3 while chatterbox-tts pins transformers==5.2.0,
# so each engine gets its own environment (see README: "Running two engines").
conflicts = [[{ extra = "qwen" }, { extra = "chatterbox" }]]
override-dependencies = [
    # chatterbox-tts pins torch==2.6.0, which ships no kernels for RTX 50-series (Blackwell, sm_120).
    # 2.7 is the first release with sm_120 support; 2.9 reworks torchaudio I/O, so stay below it.
    "torch>=2.7.1,<2.9",
    "torchaudio>=2.7.1,<2.9",
    # Only used by the upstream Gradio demo apps.
    "gradio; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]
